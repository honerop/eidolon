name: Zig Nix native build

on:
  pull_request:
  push:
    paths:
      - flake.nix
      - flake.lock
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - .github/workflows/babel-nix.yml
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Compile Zig and render offline smoke MP4
        run: nix flake check -L
