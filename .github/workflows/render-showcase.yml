name: Render Zig showcase MP4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - examples/math-explainer.json
      - .github/workflows/render-showcase.yml

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Render showcase through native Zig engine
        run: EIDOLON_SKIP_TTS=1 nix run .
      - name: Verify MP4 and subtitle
        run: |
          test -s showcase.mp4
          test -f showcase.srt
          file showcase.mp4 | grep -qi 'ISO Media'
      - uses: actions/upload-artifact@v4
        with:
          name: eidolon-zig-showcase-mp4
          path: |
            showcase.mp4
            showcase.srt
          retention-days: 14
