name: Zig renderer checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'flake.nix'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Compile and run Zig unit tests
        run: |
          nix develop -c sh -c 'zig version; zig test src/support.zig -lc; zig test src/svg.zig -lc; zig test src/main.zig -lc'
      - name: Build Zig director and render MP4
        run: nix flake check -L
