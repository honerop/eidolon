name: Zig-native video director regression

on:
  push:
    paths:
      - 'src/**'
      - 'flake.nix'
      - 'examples/**'
      - '.github/workflows/zig-director.yml'
  pull_request:
  workflow_dispatch:

jobs:
  zig-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Build native Zig renderer
        run: nix build .#director -L
      - name: Check static, educational and math videos
        run: nix flake check -L
